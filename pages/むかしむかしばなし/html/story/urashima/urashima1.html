<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="/common/css/reset.css">
    <link rel="stylesheet" href="/common/css/style-header.css">
    <link rel="stylesheet" href="/pages/むかしむかしばなし/css/urashima/urashima-story.scss">
    <title>浦島太郎1</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="header">
                <div class="logo-area">
                    <img class="logo" src="/image/logo2.png" alt="logo">
                </div>
                <div class="button-area">
                    <a class="btn story" href="/pages/むかしむかしばなし/index.html">ストーリー</a>
                    <a class="btn home" href="/index.html">ホーム</a>
                    <a class="btn logout" href="/pages/ログインページ/index.html">ログアウト</a>
                </div>
            </div>
            <div class="content-area">
                <ul class="content-list">
                    <li class="item picture-area" id="item1">
                        <div class="picture" id="LeftImg">
                            <img class="img" id="inu" src="/image/" alt="">
                            <img class="img" id="momotaro" src="/image/" alt="">
                            <img class="img" id="oji-oba" src="/image/" alt="">
                        </div>
                    </li>
                    <li class="item qestion-area" id="item1.5">
                        <div class="text-area">
                            <div class="content qestion-content">
                                <p class="text" id="q-text1">
                                    <p>
                                        Q1. あなたの名前は？
                                    </p>
                                    <input type="text" id="q1" placeholder="(例) 浦島太郎">
                                </p>
                                <p class="text" id="q-text2">
                                    <p>
                                        Q2. 子供の将来の夢は？
                                    </p>
                                    <input type="text" id="q2" placeholder="(例) 漁師">
                                </p>
                                <p class="text" id="q-text3">
                                    <p>
                                        Q3. 動物を飼うとしたら何がいい？
                                    </p>
                                    <input type="text" id="q3" placeholder="(例) 亀">
                                </p>
                                <p class="text" id="q-text4">
                                    <p>
                                        Q4. 一生に一回は行ってみたい場所は？
                                    </p>
                                    <input type="text" id="q4" placeholder="(例) 竜宮城">
                                </p>
                                <p class="text" id="q-text5">
                                    <p>
                                        q5. 憧れの人は？
                                    </p>
                                    <input type="text" id="q5" placeholder="(例) 乙姫">
                                </p>
                            </div>
                        </div>
                        <div class="answer-btn">
                            <button id="a-btn" type="button">回答</button>
                        </div>
                    </li>
                    <li class="item story-area" id="item2">
                    </li>
                    <li class="item picture-area" id="item3">
                        <div class="picture">
                        </div>
                    </li>
                </ul>


            </div>
        </div>
    </main>    

</body>

</html>
