<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="/common/css/reset.css">
    <link rel="stylesheet" href="/common/css/style-header.css">
    <link rel="stylesheet" href="/pages/むかしむかしばなし/css/urashima/urashima-story.css">
    <title>浦島太郎1</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="header">
                <div class="logo-area">
                    <img class="logo" src="/image/logo2.png" alt="logo">
                </div>
                <div class="button-area">
                    <a class="btn story" href="/pages/むかしむかしばなし/index.html">ストーリー</a>
                    <a class="btn home" href="/index.html">ホーム</a>
                    <a class="btn logout" href="/pages/ログインページ/index.html">ログアウト</a>
                </div>
            </div>
            <div class="content-area">
                <ul class="content-list">
                    <li class="item picture-area" id="item1">
                        <div class="picture">
                            <img class="img LeftImg" id="LeftImg1" src="/image/urashima-taro.png" alt="">
                            <img class="img LeftImg" id="LeftImg2" src="/image/otohime.png" alt="">
                            <img class="img LeftImg" id="LeftImg3" src="/image/tamatebako_close.png" alt="">
                        </div>
                    </li>
                    <li class="item qestion-area" id="item1.5">
                        <div class="text-area">
                            <div class="content qestion-content">
                                <div class="q-text">
                                    <p class="text" id="q-text1">
                                        Q1. あなたの名前は？
                                    </p>
                                        <input class="input-text" type="text" id="q1" placeholder="(例) 浦島太郎">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text2">
                                        Q2. 子供の将来の夢は？
                                    </p>
                                        <input class="input-text" type="text" id="q2" placeholder="(例) 漁師">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text3">
                                        Q3. 動物を飼うとしたら何がいい？
                                    </p>
                                        <input class="input-text" type="text" id="q3" placeholder="(例) 亀">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text4">
                                        Q4. 一生に一回は行ってみたい場所は？
                                    </p>
                                        <input class="input-text" type="text" id="q4" placeholder="(例) 竜宮城">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text5">
                                        q5. 憧れの人は？
                                    </p>
                                        <input class="input-text" type="text" id="q5" placeholder="(例) 乙姫">
                                </div>
                            </div>
                        </div>
                        <div class="answer-btn">
                            <button id="a-btn" type="button">回答</button>
                        </div>
                    </li>
                    <li class="item story-area" id="item2">
                    </li>
                    <li class="item picture-area" id="item3">
                        <div class="picture">
                            <img class="img RightImg" id="RightImg1" src="/image/ryugujo.png" alt="">
                            <img class="img RightImg" id="RightImg2" src="/image/tamatebako_smoke.png" alt="">
                            <img class="img RightImg" id="RightImg3" src="/image/urashima-taro&kame.png" alt="">
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </main>    
    <script src="/pages/むかしむかしばなし/js/urashima/js_urashima1.js"></script>
</body>

</html>
