<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="/common/css/reset.css">
    <link rel="stylesheet" href="/common/css/style-header.css">
    <link rel="stylesheet" href="/pages/むかしむかしばなし/css/momotaro/momotaro-story.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="header">
                <div class="logo-area">
                     <img class="logo" src="/image/logo2.png" alt="logo">
                </div>
                 <div class="button-area">
                    <a class="btn story" href="/pages/むかしむかしばなし/index.html">ストーリー</a>
                    <a class="btn home" href="/index.html">ホーム</a>
                    <a class="btn logout" href="/pages/ログインページ/index.html">ログアウト</a>
                </div>
            </div>
            <div class="content-area">
                <ul class="content-list">
                    <li class="item picture-area" id="item1">
                        <div class="picture" id="LeftImg">
                            <img class="img" id="inu" src="/image/inu.png" alt="">
                            <img class="img" id="momotaro" src="/image/momo-taro.png" alt="">
                            <img class="img" id="oji-oba" src="/image/ojisan-obasan.png" alt="">
                        </div>
                    </li>
                    <li class="item qestion-area" id="item1.5">
                        <div class="text-area">
                            <div class="content qestion-content">
                                <div class="q-text">
                                    <p class="text" id="q-text1">
                                        Q1. あなたの好きな食べ物は？
                                    </p>
                                    <input class="input-text" type="text" id="q1" placeholder="(例) カレー">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text2">
                                        Q.2 あなたの好きな色は？
                                    </p>
                                    <input class="input-text" type="text" id="q2" placeholder="(例) 赤">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text3">
                                         Q. 3あなたの子供の頃のあだ名は？
                                    </p>
                                    <input class="input-text" type="text" id="q3" placeholder="(例) キング、どの子、ターボー、ケンゾー等">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text4">
                                        Q.4 お金をもらってもしたくないことは？
                                    </p>
                                    <input class="input-text" type="text" id="q4" placeholder="(例) スカイダイビング、Gを触る・退治する、犯罪等">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text5">
                                        Q.5 心を落ち着かせたいときに飲みたい飲み物は？
                                    </p>
                                    <input class="input-text" type="text" id="q5" placeholder="(例) 熱いお茶、バーブティー等">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text6">
                                        Q.6 好きなスポーツ、遊びは？
                                    </p>
                                    <input class="input-text" type="text" id="q6" placeholder="(例) 野球、バドミントン、バレー、おにごっこ等">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text7">
                                        Q.7 あなたが今欲しいものは？
                                    </p>
                                    <input class="input-text" type="text" id="q7" placeholder="(例) 友情、努力、勝利、コーラ等">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text8">
                                        Q.8 友達を励ますときにかける一言は？
                                    </p>
                                    <input class="input-text" type="text" id="q8" placeholder="(例)飲み行こう">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text9">
                                        Q.9 友達を遊びに誘うときにかける言葉は？
                                    </p>
                                    <input class="input-text" type="text" id="q9" placeholder="(例)野球しようぜ！">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text10">
                                        Q.10 好きな俳優の名前、またはキャラクターの名前は？
                                    </p>
                                    <input class="input-text" type="text" id="q10" placeholder="(例)ミッキー、ガッキー、タッキー、ラッキー等">
                                </div>
                            </div>
                        </div>
                        <div class="answer-btn">
                            <button id="a-btn" type="button">回答</button>
                        </div>
                    </li>
                    <li class="item story-area" id="item2">
                        
                    </li>
                    <li class="item picture-area" id="item3">
                        <div class="picture" id="RightImg">
                            <img class="img" id="kiji" src="/image/kiji.png" alt="">
                            <img class="img" id="saru" src="/image/saru.png" alt="">
                            <img class="img" id="oni" src="/image/oni.png" alt="">
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </main>
    <script src="/pages/むかしむかしばなし/js/momotaro/main_momotaro3.js"></script>
</body>
</html>
