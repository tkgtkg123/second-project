<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="/common/css/reset.css">
    <link rel="stylesheet" href="/common/css/style-header.css">
    <link rel="stylesheet" href="/pages/むかしむかしばなし/css/momotaro/momotaro-story.css">
    <title>桃太郎4</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="header">
                <div class="logo-area">
                    <img class="logo" src="/image/logo2.png" alt="logo">
                </div>
                 <div class="button-area">
                    <a class="btn story" href="/pages/むかしむかしばなし/index.html">ストーリー</a>
                    <a class="btn home" href="/index.html">ホーム</a>
                    <a class="btn logout" href="/pages/ログインページ/index.html">ログアウト</a>
                </div>
            </div>
            <div class="content-area">
                <ul class="content-list">
                    <li class="item picture-area" id="item1">
                        <div class="picture" id="LeftImg">
                            <img class="img" id="inu" src="/image/inu.png" alt="">
                            <img class="img" id="momotaro" src="/image/momo-taro.png" alt="">
                            <img class="img" id="oji-oba" src="/image/ojisan-obasan.png" alt="">
                        </div>
                    </li>
                    <li class="item qestion-area" id="item1.5">
                        <div class="text-area">
                            <div class="content qestion-content">
                                <div class="q-text">
                                    <p class="text" id="q-text1">
                                        Q1.あなたにとって大切なものは？
                                    </p>
                                    <input class="input-text" type="text" id="q1" placeholder="(例) 家族、お金">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text2">
                                        Q.2あなたの好きな動物は？
                                    </p>
                                    <input class="input-text" type="text" id="q2" placeholder="(例) ライオン">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text3">
                                    </p>
                                    <input class="input-text" type="text" id="q3" placeholder="(例) 鬼に金棒">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text4">
                                    </p>
                                    <input class="input-text" type="text" id="q4" placeholder="(例) 肉食いて～">
                                </div>
                                <div class="q-text">
                                    <p class="text" id="q-text5">
                                    </p>
                                    <input class="input-text" type="text" id="q5" placeholder="(例) どうしたの？だいじょうぶ？">
                                </div>




                            </div>
                        </div>
                        <div class="answer-btn">
                            <button id="a-btn" type="button">回答</button>
                        </div>
                    </li>
                    <li class="item story-area" id="item2">
                    </li>
                    <li class="item picture-area" id="item3">
                       <div class="picture" id="RightImg">
                            <img class="img" id="kiji" src="/image/kiji.png" alt="">
                            <img class="img" id="saru" src="/image/saru.png" alt="">
                            <img class="img" id="oni" src="/image/oni.png" alt="">
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </main>    
    <script src="/pages/むかしむかしばなし/js/momotaro/main_momotaro1.js"></script>
</body>

</html>
