<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/common/css/reset.css">
    <link rel="stylesheet" href="/pages/すっぽぬけワードウルフ/css/style.css">
    <title>すっぽぬけワードウルフ</title>
</head>
<body>
    <main>
        <div class="container">

            <!-- ------以下、ヘッダー部------- -->
            <div class="header">
                <div class="logo-area">
                    <img class="logo" src="/image/logo2.png" alt="logo">
                </div>
                <div class="button-area">
                    <button class="btn logout"><a href="/pages/ログインページ/index.html">ログアウト</a></button>
                </div>
            </div>

            <!-- ------以下、アプリ本体------- -->

            <div class="main menber_option">
                <div class="name_area">
                    <input type="text" class="name_input" placeholder="名前を入力">
                    <button class="menber_btn add">＋</button>
                    <button class="menber_btn remove">ー</button>
                </div>
                <div class="btn_area"><button class="btn moji"></button></div>
            </div>

        </div>

    </main>    

</body>

</html>
